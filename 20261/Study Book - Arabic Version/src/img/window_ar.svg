<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1500" height="495" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1000" height="330" fill="#FFFFFF"/>
<style>
text{font-family:'DejaVu Sans',sans-serif;fill:#2F343B}
.t{font-size:21px;font-weight:bold}
.e{font-size:15px;fill:#56616D}
.s{font-size:16px}
</style>
<text x="500" y="38" class="t" text-anchor="middle">نافذة السياق: ميزانية واحدة للمدخلات والمخرجات</text>
<text x="500" y="60" class="e" text-anchor="middle">Context Window — input and output tokens share one limit</text>
<!-- bar right-to-left: input (right), output, free (left) -->
<rect x="40" y="95" width="920" height="70" fill="none" stroke="#2F343B" stroke-width="2"/>
<rect x="500" y="95" width="460" height="70" fill="#C8ABC3"/>
<rect x="320" y="95" width="180" height="70" fill="#6C91A8"/>
<rect x="40" y="95" width="280" height="70" fill="#F3F4F6"/>
<text x="730" y="137" class="t" text-anchor="middle" style="fill:#2F343B">المدخلات (Input)</text>
<text x="410" y="137" class="t" text-anchor="middle" style="fill:#FFFFFF">المخرجات</text>
<text x="180" y="137" class="t" text-anchor="middle">مساحة فارغة</text>
<text x="730" y="195" class="s" text-anchor="middle">الأمر النظامي + سجل المحادثة + السؤال + النص المسترجع</text>
<text x="410" y="195" class="s" text-anchor="middle">إجابة النموذج (Output)</text>
<text x="180" y="195" class="s" text-anchor="middle">لم تُستخدم بعد</text>
<line x1="960" y1="230" x2="40" y2="230" stroke="#56616D" stroke-width="2"/>
<line x1="960" y1="222" x2="960" y2="238" stroke="#56616D" stroke-width="2"/><line x1="40" y1="222" x2="40" y2="238" stroke="#56616D" stroke-width="2"/>
<text x="500" y="262" class="s" text-anchor="middle">الحد الأقصى مثلًا 8,192 token (Context Window)</text>
<text x="500" y="298" class="e" text-anchor="middle">كلما طال سجل المحادثة اتسعت المدخلات وضاقت المساحة المتاحة للإجابة</text>
