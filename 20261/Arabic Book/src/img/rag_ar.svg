<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1500" height="705" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1000" height="470" fill="#FFFFFF"/>
<style>
text{font-family:'DejaVu Sans',sans-serif;fill:#2F343B}
.t{font-size:22px;font-weight:bold}
.e{font-size:16px;fill:#56616D}
.n{font-size:20px;font-weight:bold;fill:#FFFFFF}
.s{font-size:15px}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#56616D"/></marker></defs>
<!-- user question -->
<rect x="700" y="20" width="270" height="62" rx="10" fill="#F5EDF4" stroke="#C8ABC3"/>
<text x="835" y="49" class="t" text-anchor="middle">سؤال المستخدم</text>
<text x="835" y="70" class="e" text-anchor="middle">User Query</text>
<!-- 4 boxes right to left -->
<g>
<rect x="745" y="150" width="225" height="130" rx="10" fill="#F7F3F7" stroke="#C8ABC3"/>
<circle cx="945" cy="150" r="18" fill="#493347"/><text x="945" y="157" class="n" text-anchor="middle">1</text>
<text x="857" y="195" class="t" text-anchor="middle">التضمين</text><text x="857" y="218" class="e" text-anchor="middle">Embed</text>
<text x="857" y="250" class="s" text-anchor="middle">تحويل السؤال إلى متجه</text>
</g>
<g>
<rect x="505" y="150" width="225" height="130" rx="10" fill="#F7F3F7" stroke="#C8ABC3"/>
<circle cx="705" cy="150" r="18" fill="#356B8C"/><text x="705" y="157" class="n" text-anchor="middle">2</text>
<text x="617" y="195" class="t" text-anchor="middle">الاسترجاع</text><text x="617" y="218" class="e" text-anchor="middle">Retrieve</text>
<text x="617" y="250" class="s" text-anchor="middle">إيجاد أقرب المقاطع معنى</text>
</g>
<g>
<rect x="265" y="150" width="225" height="130" rx="10" fill="#F7F3F7" stroke="#C8ABC3"/>
<circle cx="465" cy="150" r="18" fill="#5E8390"/><text x="465" y="157" class="n" text-anchor="middle">3</text>
<text x="377" y="195" class="t" text-anchor="middle">التعزيز</text><text x="377" y="218" class="e" text-anchor="middle">Augment</text>
<text x="377" y="250" class="s" text-anchor="middle">إضافة المقاطع إلى الموجِّه</text>
</g>
<g>
<rect x="25" y="150" width="225" height="130" rx="10" fill="#F7F3F7" stroke="#C8ABC3"/>
<circle cx="225" cy="150" r="18" fill="#8A6884"/><text x="225" y="157" class="n" text-anchor="middle">4</text>
<text x="137" y="195" class="t" text-anchor="middle">التوليد</text><text x="137" y="218" class="e" text-anchor="middle">Generate</text>
<text x="137" y="250" class="s" text-anchor="middle">النموذج يكتب الإجابة</text>
</g>
<!-- arrows between boxes (right to left) -->
<line x1="745" y1="215" x2="733" y2="215" stroke="#56616D" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="505" y1="215" x2="493" y2="215" stroke="#56616D" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="265" y1="215" x2="253" y2="215" stroke="#56616D" stroke-width="2.5" marker-end="url(#a)"/>
<!-- question to box1 -->
<line x1="835" y1="82" x2="835" y2="148" stroke="#56616D" stroke-width="2.5" marker-end="url(#a)"/>
<!-- vector DB -->
<g>
<ellipse cx="617" cy="380" rx="145" ry="16" fill="#EFF4F7" stroke="#6C91A8"/>
<rect x="472" y="380" width="290" height="52" fill="#EFF4F7" stroke="none"/>
<line x1="472" y1="380" x2="472" y2="432" stroke="#6C91A8"/><line x1="762" y1="380" x2="762" y2="432" stroke="#6C91A8"/>
<ellipse cx="617" cy="432" rx="145" ry="16" fill="#EFF4F7" stroke="#6C91A8"/>
<text x="617" y="406" class="t" text-anchor="middle">قاعدة بيانات المتجهات</text>
<text x="617" y="426" class="e" text-anchor="middle">Vector Database</text>
</g>
<line x1="617" y1="364" x2="617" y2="284" stroke="#6C91A8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
<!-- answer -->
<rect x="25" y="365" width="225" height="62" rx="10" fill="#F5EDF4" stroke="#C8ABC3"/>
<text x="137" y="393" class="t" text-anchor="middle">الإجابة النهائية</text>
<text x="137" y="415" class="e" text-anchor="middle">Final Answer</text>
<line x1="137" y1="282" x2="137" y2="363" stroke="#56616D" stroke-width="2.5" marker-end="url(#a)"/>
<!-- LLM label under box 3/4 -->
<text x="377" y="330" class="s" text-anchor="middle" style="fill:#56616D">الموجِّه = السؤال + المقاطع المسترجعة</text>
<text x="377" y="352" class="e" text-anchor="middle">Prompt = Query + Retrieved Context</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
